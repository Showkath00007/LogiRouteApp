name: DevSecOps Backend SAST DAST & Performance Security Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "security-review-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  selenium-tests:
    name: Selenium — Website Tests (400)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests jinja2 pytest selenium

      - name: Stage 3 - Execute 400 Selenium Web Tests
        run: |
          python automation/utils/generate_exact_400_web.py

      - name: Stage 4 - Upload Selenium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Website_Test_Results
          path: |
            Test Results/Excel/Automation_Test_Report.xlsx
            Test Results/
          retention-days: 30

  appium-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mobile Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests jinja2 pytest

      - name: Stage 3 - Execute Appium Android Tests
        run: |
          python mobile-automation/utils/generate_exact_400_mobile.py

      - name: Stage 4 - Upload Appium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium_Android_Test_Results
          path: |
            mobile-automation/reports/
          retention-days: 30

  unit-tests:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Unit Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests jinja2 pytest

      - name: Stage 3 - Execute 300 Unit API Tests
        run: |
          python automation/utils/generate_300_test_cases.py

      - name: Stage 4 - Upload Unit Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit_API_Test_Results
          path: |
            Test Results/Automation_Test_Report_300.xlsx
          retention-days: 30

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests jinja2 pytest

      - name: Stage 3 - Execute Validation & Security Suite
        run: |
          python "Vulnerability Test Results/generate_security_excel_sheets.py"

      - name: Stage 4 - Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Validation_Security_Test_Results
          path: |
            Vulnerability Test Results/
          retention-days: 30

  deployment-status:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests jinja2 pytest

      - name: Stage 3 - Verify Deployment & Backend Endpoints
        run: |
          python "Vulnerability Test Results/generate_exact_400_backend.py"

      - name: Stage 4 - Upload Deployment Status Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Deployment_Status_Test_Results
          path: |
            Vulnerability Test Results/endpoint-inventory.xlsx
            Vulnerability Test Results/test-cases.xlsx
          retention-days: 30

  load-testing:
    name: Load Testing — Performance (400)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Performance Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests jinja2 pytest

      - name: Stage 3 - Execute Stress & Spike Load Tests
        run: |
          python automation/utils/generate_load_test_excel.py

      - name: Stage 4 - Upload Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load_Testing_Performance_Results
          path: |
            Test Results/Load_Test_Report.xlsx
            Test Results/Excel/Load_Test_Report.xlsx
          retention-days: 30

  compile-master:
    name: Compile Master Report & Deploy
    needs: [selenium-tests, appium-tests, unit-tests, validation-tests, deployment-status, load-testing]
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Report Compiler Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests jinja2 pytest

      - name: Stage 3 - Compile Master Combined 800+ Report
        run: |
          python automation/utils/generate_master_excel_report.py

      - name: Stage 4 - Upload Master Consolidated Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Master_Consolidated_Test_Report
          path: |
            Test Results/
            automation/reports/
            mobile-automation/reports/
          retention-days: 30

      - name: Stage 5 - Publish Master Step Summary
        if: always()
        run: |
          if [ -f "automation/reports/Summary/summary.md" ]; then
            cat "automation/reports/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "Vulnerability Test Results/executive-summary.md" ]; then
            echo -e "\n---\n" >> $GITHUB_STEP_SUMMARY
            cat "Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi
