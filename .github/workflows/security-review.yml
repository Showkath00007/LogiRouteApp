name: DevSecOps Backend SAST DAST & Performance Security Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Audit Dependencies
        run: |
          python -m pip install openpyxl requests jinja2 pytest

      - name: Stage 3 - Run SAST & Dependency Audit
        run: |
          npm audit --json > "Vulnerability Test Results/npm-audit.json" || true

      - name: Stage 4 - Run Security Excel Generator
        run: |
          python "Vulnerability Test Results/generate_security_excel_sheets.py"

      - name: Stage 5 - Upload Security Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backend_Security_Audit_Artifacts
          path: |
            Vulnerability Test Results/
          retention-days: 30

      - name: Stage 6 - Publish GitHub Step Summary
        if: always()
        run: |
          cat "Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
